<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momasoja | توسعه‌دهنده</title>
<meta name="description" content="سایت شخصی Momasoja، توسعه‌دهنده اپلیکیشن و سازنده محتوا.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>">

<!-- فونت وزیرمتن -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
:root {
  --bg: #0a0a0f;
  --card: #13131a;
  --border: #23232f;
  --text: #ffffff;
  --muted: #8b8b9e;
  --accent: #7c5cff;
  --accent-glow: rgba(124, 92, 255, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* دکمه تغییر زبان */
.lang-toggle {
  position: absolute;
  top: 24px;
  left: 24px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  font-size: 0.9rem;
  transition: 0.3s;
  z-index: 100;
}
.lang-toggle:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
}

/* بخش هیرو (معرفی) */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 80px 20px 40px;
  width: 100%;
  max-width: 800px;
}

.avatar-container {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--accent), #00e5ff);
  box-shadow: 0 0 30px var(--accent-glow);
  margin-bottom: 24px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--bg);
}

h1 {
  font-size: 2.2rem;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.title {
  color: var(--accent);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 24px;
}

/* دکمه آپارات */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  color: var(--text);
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 14px;
  border: 1px solid var(--border);
  font-weight: 600;
  transition: 0.3s;
}
.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 8px 25px var(--accent-glow);
  transform: translateY(-3px);
}

/* بخش اپلیکیشن‌ها */
.apps-section {
  width: 100%;
  max-width: 900px;
  padding: 40px 20px 80px;
}

.section-title {
  font-size: 1.4rem;
  margin-bottom: 24px;
  padding-right: 20px;
  border-right: 4px solid var(--accent);
}

.apps-row {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 10px 20px 20px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none; /* فایرفاکس */
}
.apps-row::-webkit-scrollbar { display: none; } /* کروم و سافاری */

.app-card {
  flex: 0 0 220px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  scroll-snap-align: start;
  transition: 0.3s;
  cursor: pointer;
}
.app-card:hover {
  border-color: var(--accent);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px var(--accent-glow);
}

.app-icon {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #23232f, #13131a);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.app-name {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.app-status {
  font-size: 0.8rem;
  color: #ff3d81;
  background: rgba(255, 61, 129, 0.1);
  padding: 4px 12px;
  border-radius: 20px;
  display: inline-block;
}

/* فوتر */
footer {
  margin-top: auto;
  padding: 30px;
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  width: 100%;
}

/* حالت راست‌چین و چپ‌چین */
html[dir="ltr"] .section-title { border-right: none; border-left: 4px solid var(--accent); padding-right: 0; padding-left: 20px; }
html[dir="ltr"] .lang-toggle { left: auto; right: 24px; }
</style>
</head>
<body>

<!-- دکمه تغییر زبان -->
<button class="lang-toggle" onclick="toggleLang()" id="langBtn">English</button>

<!-- بخش معرفی -->
<header class="hero">
  <div class="avatar-container">
    <!-- اسم عکسی که ذخیره کردی باید avatar.jpg باشه -->
    <img src="avatar.png" alt="Momasoja" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=M&background=7c5cff&color=fff&size=130'">
  </div>
  
  <h1>Momasoja</h1>
  
  <p class="title" data-fa="توسعه‌دهنده اپلیکیشن و سازنده محتوا" data-en="App Developer & Content Creator">
    توسعه‌دهنده اپلیکیشن و سازنده محتوا
  </p>

  <a href="https://www.aparat.com/Momasoja/" target="_blank" class="btn">
    <span style="color: #ff3d81; font-size: 1.2rem;">▶</span> 
    <span data-fa="کانال آپارات من" data-en="My Aparat Channel">کانال آپارات من</span>
  </a>
</header>

<!-- بخش اپلیکیشن‌ها -->
<section class="apps-section">
  <h2 class="section-title" data-fa="اپلیکیشن‌ها" data-en="Applications">اپلیکیشن‌ها</h2>
  
  <div class="apps-row">
    
    <!-- کارت اپ ۱ -->
    <div class="app-card">
      <div class="app-icon">📱</div>
      <div class="app-name" data-fa="اپلیکیشن اول" data-en="App One">اپلیکیشن اول</div>
      <span class="app-status" data-fa="در دست ساخت" data-en="In Development">در دست ساخت</span>
    </div>

    <!-- کارت اپ ۲ -->
    <div class="app-card">
      <div class="app-icon">⚙️</div>
      <div class="app-name" data-fa="اپلیکیشن دوم" data-en="App Two">اپلیکیشن دوم</div>
      <span class="app-status" data-fa="در دست ساخت" data-en="In Development">در دست ساخت</span>
    </div>

    <!-- کارت اپ ۳ -->
    <div class="app-card">
      <div class="app-icon">🚀</div>
      <div class="app-name" data-fa="اپلیکیشن سوم" data-en="App Three">اپلیکیشن سوم</div>
      <span class="app-status" data-fa="در دست ساخت" data-en="In Development">در دست ساخت</span>
    </div>

  </div>
</section>

<footer>
  <span data-fa="ساخته شده با ❤️ توسط Momasoja" data-en="Made with ❤️ by Momasoja">ساخته شده با ❤️ توسط Momasoja</span>
</footer>

<script>
  let isFa = true;

  function toggleLang() {
    isFa = !isFa;
    const html = document.documentElement;
    const btn = document.getElementById('langBtn');
    
    // تغییر جهت صفحه
    html.dir = isFa ? 'rtl' : 'ltr';
    html.lang = isFa ? 'fa' : 'en';
    
    // تغییر متن دکمه
    btn.innerText = isFa ? 'English' : 'فارسی';
    
    // تغییر تمام متن‌های دارای data-fa و data-en
    document.querySelectorAll('[data-fa]').forEach(el => {
      el.innerText = isFa ? el.getAttribute('data-fa') : el.getAttribute('data-en');
    });
  }
</script>

</body>
</html>
